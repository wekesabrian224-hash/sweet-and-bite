<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sign Up - Sweet and Bite</title>
</head>

<body bgcolor="pink">

  <div align="center">

    <div style="width:45%; background:white; padding:40px; border-radius:20px;">

      <h1>
        <font color=" dark pink" size="6">Create Account 🍰</font>
      </h1>

      <p>
        <font color="blue" size="3">Join Sweet and Bite today</font>
      </p>

      <form>

        <p>
          <font size="3">Full Name</font><br>
          <input type="text" size="30" required>
        </p>

        <p>
          <font size="3">Date of Birth</font><br>
          <input type="date" >
        </p>

        <p>
          <font size="3">Gender</font><br>

          <input type="radio" name type="gender" value="female"> Female
          <input type="radio" name type="gender" value="male"> Male


        </p>

        <p>
          <font size="3">Phone Number</font><br>
          <input type="tel" placeholder="Enter Number"
        </p>

        <p>
          <font size="3">Email</font><br>
          <input type="email" placeholder="Enter your email" ="30" >
        </p>

        <p>
          <font size="3">Password</font><br>
          <input type="password" size="30" >
        </p>

        <p>
          <input type="checkbox" >
          <font size="2">
            I agree to the Terms and Conditions
          </font>
        </p>

        <br>

        <button type="submit" style="background:pink; color:white;">
          Sign Up
        </button>

      </form>

      <br>

      <a href="login.html">
        <font color="blue">Already have an account? Login</font>
      </a>

    </div>

  </div>

</body>
</html>
